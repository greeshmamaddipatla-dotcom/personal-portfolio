<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Greeshma Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-intro">
            <div>
                <h1>Welcome Back!</h1>
                <p>
                    Login to explore my personal portfolio,
                    projects, skills and achievements.
                </p>
            </div>
        </div>

        <!-- Login Form -->
        <div class="login-card">

            <h2>Login</h2>
            <p class="login-text">Enter your details to continue</p>

            <form id="loginForm">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">LOGIN</button>

                <p id="loginMessage"></p>

            </form>

            <p class="demo-login">
                Demo: <b>greeshma</b> / <b>1234</b>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
